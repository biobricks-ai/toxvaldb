stages:

  check_version:
    cmd: bash stages/0_invalidate.sh
    outs:
      - download/version.json

  download:
    cmd: python stages/1_download.py
    deps:
      - stages/1_download.py
      - download/version.json
    outs:
      - download/manifest.json
      - download/excel:
          persist: true

  process:
    cmd: python stages/2_process.py
    deps:
      - stages/2_process.py
      - download/manifest.json
    outs:
      - brick/toxvaldb.parquet
      - brick/version.json
